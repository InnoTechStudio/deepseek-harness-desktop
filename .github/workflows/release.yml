name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "要发布的版本号（如 1.0.7）。tag 为空时按 package.json 里的版本取"
        required: false
        default: ""

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            name: macOS (aarch64)
            artifact_name: dshdesk-macos-aarch64
            bundle: dmg
            archive: macos
            rust_target: aarch64-apple-darwin
            artifact_arch: aarch64
          - platform: windows-latest
            name: Windows (x64)
            artifact_name: dshdesk-windows-x64
            bundle: nsis
            archive: windows
            rust_target: x86_64-pc-windows-msvc
            artifact_arch: x64
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          # 由 tag 或手动输入取版本号，两处留一。
          if [ "${{ github.event_name }}" = "push" ]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER="${{ inputs.version }}"
            if [ -z "$VER" ]; then
              VER=$(node -p "require('./package.json').version")
            fi
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VER"

      - name: Extract release notes
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          VER="${{ steps.ver.outputs.version }}"
          # 必须排在打包前面：build-artifacts 会先清空 APP/，而 APP/CHANGELOG.md
          # 就在那个目录里。提取完存成文件，随 artifact 带去发布任务。
          awk "/^## ${VER}（|^## ${VER} /{flag=1;next} /^## /{flag=0} flag" APP/CHANGELOG.md > RELEASE_NOTES.md || true
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "本次发布以双端自动编译产物为准，更新说明见 CHANGELOG.md。" > RELEASE_NOTES.md
          fi
          echo "Extracted notes:" && cat RELEASE_NOTES.md

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Build desktop shell plugin
        working-directory: dsh-desktop-shell
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Sync shell resources into src-tauri
        run: node scripts/sync-shell-resources.mjs

      - name: Install frontend deps and build Tauri app
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build bundle
        run: pnpm tauri build --bundles ${{ matrix.bundle }} --target ${{ matrix.rust_target }}

      - name: Archive build artifact
        env:
          TAURI_BUILD_TARGET: ${{ matrix.rust_target }}
          DSH_ARTIFACT_ARCH: ${{ matrix.artifact_arch }}
        run: node scripts/build-artifacts.mjs ${{ matrix.archive }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: APP/${{ matrix.archive }}
          if-no-files-found: error

      - name: Upload release notes
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: RELEASE_NOTES.md

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER="${{ inputs.version }}"
            if [ -z "$VER" ]; then
              VER=$(node -p "require('./package.json').version")
            fi
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VER"

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Collect assets
        shell: bash
        run: |
          mkdir -p release-assets
          cp artifacts/dshdesk-macos-aarch64/*.dmg release-assets/ 2>/dev/null || true
          cp artifacts/dshdesk-windows-x64/*.exe release-assets/ 2>/dev/null || true
          ls -la release-assets/

      - name: Generate update.json
        shell: bash
        run: |
          node scripts/make-update-manifest.mjs \
            --version="${{ steps.ver.outputs.version }}" \
            --macos-dir=release-assets \
            --windows-dir=release-assets \
            --changelog=APP/CHANGELOG.md \
            --out=update.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: DeepSeek Harness ${{ steps.ver.outputs.version }}
          body_path: artifacts/release-notes/RELEASE_NOTES.md
          files: |
            release-assets/*.dmg
            release-assets/*.exe
            update.json
          fail_on_unmatched_files: false

      - name: Commit update.json back to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add update.json
          git diff --cached --quiet || git commit -m "chore(release): update.json for ${{ steps.ver.outputs.version }}"
          # tag 触发时 checkout 处于 detached HEAD，必须显式指定目标分支名。
          git push origin HEAD:main
